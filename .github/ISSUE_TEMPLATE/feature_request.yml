name: Feature request
description: An idea for SeatSniper
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        A short, specific idea is easier to act on than a long wishlist. One issue per idea, please.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      placeholder: "I keep missing the moment Friday shows go on sale and want tighter filtering."
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed behaviour
      placeholder: "A /watch option or alert improvement with concrete inputs and expected DM output."
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: Fits the project?
      description: "SeatSniper is strictly read-only: account login, seat holding, checkout automation, and web dashboards are non-goals."
      options:
        - "Yes, within read-only alerting scope"
        - "It would expand the non-goals"
    validations:
      required: true
