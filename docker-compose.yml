services:
  seatsniper:
    build: .
    container_name: seatsniper
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      - DB_PATH=/data/seatsniper.db
      - LIVENESS_PATH=/data/last_cycle.json
    volumes:
      - seatsniper_data:/data
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  seatsniper_data:
